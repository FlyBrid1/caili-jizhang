<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF8F3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>彩礼记账</title>
  <style>
    :root {
      --bg: #fbf8f3;
      --ink: #2a241c;
      --muted: #8d8274;
      --line: #e7e0d6;
      --red: #9c1f33;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: #f3efe8;
      color: var(--ink);
    }
    button, input { font-family: inherit; }
    .phone {
      width: min(100%, 430px);
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    header {
      position: relative;
      height: 56px;
      flex: none;
    }
    header h1 {
      margin: 0;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      pointer-events: none;
    }
    .add, .recognize {
      position: absolute;
      top: 8px;
      height: 40px;
      padding: 0 10px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .add { right: 8px; }
    .recognize { left: 8px; }
    .tabs {
      flex: none;
      display: flex;
      gap: 10px;
      padding: 2px 16px 8px;
    }
    .tab {
      flex: 1;
      height: 40px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #5e564c;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(90, 60, 30, 0.06);
    }
    .tab.on { background: var(--red); color: #fff; box-shadow: none; }
    .search {
      flex: none;
      padding: 0 16px 8px;
    }
    .search input {
      width: 100%;
      height: 40px;
      border: 1px solid #e4ddd3;
      border-radius: 999px;
      padding: 0 14px;
      font-size: 15px;
      color: var(--ink);
      background: #fff;
      -webkit-appearance: none;
      appearance: none;
    }
    .search input:focus { outline: 2px solid rgba(156, 31, 51, 0.25); border-color: #c9a0a6; }
    main {
      flex: 1;
      overflow: auto;
      padding: 8px 18px 12px;
    }
    .empty {
      margin: 28vh 12px 0;
      text-align: center;
      color: var(--muted);
    }
    .empty strong {
      display: block;
      color: var(--ink);
      font-size: 16px;
      font-weight: 650;
      margin-bottom: 6px;
    }
    .stack { display: flex; flex-direction: column; align-items: center; }
    .tier {
      position: relative;
      display: block;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      margin: 0 0 10px;
      filter: drop-shadow(0 7px 5px rgba(120, 72, 40, 0.14));
    }
    .tier svg { display: block; width: 100%; height: 100%; }
    .tier .label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      line-height: 1.25;
    }
    .tier.dome .label { padding-top: 18px; }
    .tier .name {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.04em;
      max-width: 86%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tier .amt {
      font-weight: 650;
      font-size: 15px;
      margin-top: 2px;
    }
    .tier.narrow .name { font-size: 15px; }
    .tier.narrow .amt { font-size: 13px; }
    .tier:active { transform: translateY(1px); }
    .bubbles {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 18px 16px;
      padding: 12px 4px 8px;
    }
    .bubble {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: 0;
      padding: 0;
      background: transparent;
      color: #fff8ec;
      cursor: pointer;
    }
    .bubble:active { transform: translateY(1px); }
    .disc {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 12px rgba(120, 72, 40, 0.16);
    }
    .blabel {
      width: 86%;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.25;
      text-shadow: 0 1px 1px rgba(80, 40, 10, 0.28);
    }
    .blabel .bname, .caption .bname {
      display: block;
      font-weight: 700;
      letter-spacing: 0.02em;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .caption {
      color: #5e564c;
      font-size: 12px;
      line-height: 1.3;
      text-align: center;
      max-width: 96px;
    }
    .caption .bamt { display: block; }
    footer {
      flex: none;
      padding: 8px 16px calc(14px + env(safe-area-inset-bottom));
    }
    .summary {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(90, 60, 30, 0.06);
      display: grid;
      grid-template-columns: 1fr 1px 1.35fr;
      align-items: center;
      min-height: 84px;
      padding: 10px 8px;
    }
    .summary .col { padding: 4px 12px; }
    .summary .k {
      display: block;
      color: #6f655b;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .summary .v {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: 0.01em;
    }
    .split { background: #eee7de; height: 46px; }
    .mask {
      position: fixed;
      inset: 0;
      background: rgba(70, 48, 28, 0.12);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
      z-index: 5;
    }
    .mask.show { display: flex; }
    .dialog {
      width: min(100%, 390px);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(60, 30, 20, 0.18);
      padding: 18px 16px 16px;
    }
    .dialog h2 {
      margin: 0 0 14px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
    }
    .row {
      display: grid;
      grid-template-columns: 72px 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .row label, .block label {
      color: #5e564c;
      font-size: 14px;
    }
    .block { margin-bottom: 8px; }
    .block label { display: block; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      height: 40px;
      border: 1px solid #e4ddd3;
      border-radius: 8px;
      padding: 0 10px;
      font-size: 16px;
      color: var(--ink);
      background: #fff;
    }
    input:focus { outline: 2px solid rgba(156, 31, 51, 0.25); border-color: #c9a0a6; }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }
    .actions button, .danger {
      height: 42px;
      border: 0;
      border-radius: 21px;
      font-size: 16px;
      cursor: pointer;
    }
    .actions button { flex: 1; }
    .cancel { background: #e6e6e6; color: #666; }
    .save { background: var(--red); color: #fff; font-weight: 650; }
    .danger {
      display: none;
      width: 100%;
      margin-top: 8px;
      background: transparent;
      color: #a12636;
    }
    .danger.show { display: block; }
    .err {
      min-height: 18px;
      margin: 0;
      color: #a12636;
      font-size: 12px;
    }
    .hint {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    textarea {
      width: 100%;
      min-height: 148px;
      border: 1px solid #e4ddd3;
      border-radius: 8px;
      padding: 10px;
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink);
      resize: vertical;
      font-family: inherit;
    }
    textarea:focus { outline: 2px solid rgba(156, 31, 51, 0.25); border-color: #c9a0a6; }
  </style>
</head>
<body>
  <div class="phone">
    <header>
      <h1>彩礼记账</h1>
      <button class="recognize" type="button" id="recognizeBtn">识别</button>
      <button class="add" type="button" id="addBtn">＋ 添加</button>
    </header>
    <div class="tabs" id="tabs">
      <button class="tab on" type="button" data-view="pyramid">金字塔图例</button>
      <button class="tab" type="button" data-view="circle">圆形图例</button>
    </div>
    <div class="search">
      <input id="searchInput" type="search" placeholder="搜索姓名" maxlength="12" autocomplete="off" enterkeyhint="search">
    </div>
    <main id="main"></main>
    <footer>
      <div class="summary">
        <div class="col">
          <span class="k">总记录</span>
          <span class="v" id="countView">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="#9c1f33" stroke-width="1.7"/>
              <path d="M3 9h18M8 3v4M16 3v4" fill="none" stroke="#9c1f33" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <span id="countText">0笔</span>
          </span>
        </div>
        <div class="split"></div>
        <div class="col">
          <span class="k">合计金额</span>
          <span class="v" id="sumView">
            <span id="sumText">0元</span>
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="#e7c56a"/>
              <circle cx="12" cy="12" r="6.5" fill="none" stroke="#b8892e" stroke-width="1.2"/>
              <path d="M12 8v8M9.5 10.2c.6-.8 1.5-1.2 2.5-1.2 1.6 0 2.6.9 2.6 2.1 0 2.4-5.2 1.2-5.2 3.5 0 1.1 1 1.9 2.6 1.9 1.1 0 2-.4 2.6-1.2" fill="none" stroke="#8a641e" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
      </div>
    </footer>
  </div>

  <div class="mask" id="mask">
    <form class="dialog" id="form">
      <h2 id="dialogTitle">编辑详情</h2>
      <div class="row">
        <label for="name">姓名</label>
        <input id="name" type="text" maxlength="12" autocomplete="name" placeholder="怎么称呼">
      </div>
      <div class="row">
        <label for="relation">关系</label>
        <input id="relation" type="text" maxlength="12" placeholder="如：表哥">
      </div>
      <div class="block">
        <label for="amount">礼金数额</label>
        <input id="amount" type="text" inputmode="decimal" placeholder="0元">
      </div>
      <p class="err" id="err"></p>
      <div class="actions">
        <button class="cancel" type="button" id="cancelBtn">取消</button>
        <button class="save" type="submit">保存</button>
      </div>
      <button class="danger" type="button" id="deleteBtn">删除这笔</button>
    </form>
  </div>

  <div class="mask" id="importMask">
    <form class="dialog" id="importForm">
      <h2>识别添加</h2>
      <p class="hint">一行一位，姓名和礼金用空格分开</p>
      <textarea id="importText" placeholder="李强  50000&#10;王芳  30000"></textarea>
      <p class="err" id="importErr"></p>
      <div class="actions">
        <button class="cancel" type="button" id="importCancel">取消</button>
        <button class="save" type="submit">添加</button>
      </div>
    </form>
  </div>

  <script>
    const KEY = "caili-jizhang-v1";
    const main = document.getElementById("main");
    const mask = document.getElementById("mask");
    const form = document.getElementById("form");
    const nameInput = document.getElementById("name");
    const relationInput = document.getElementById("relation");
    const amountInput = document.getElementById("amount");
    const err = document.getElementById("err");
    const deleteBtn = document.getElementById("deleteBtn");
    const dialogTitle = document.getElementById("dialogTitle");

    let records = load();
    let editingId = null;
    let deleteArmed = false;
    let view = "pyramid";
    let query = "";
    const searchInput = document.getElementById("searchInput");

    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(KEY) || "[]");
        return Array.isArray(data) ? data.filter(isRecord) : [];
      } catch (e) {
        return [];
      }
    }
    function isRecord(item) {
      return item && typeof item.id === "string" && typeof item.name === "string" && typeof item.amount === "number";
    }
    function saveStore() {
      localStorage.setItem(KEY, JSON.stringify(records));
    }
    function sorted() {
      return records.slice().sort(function (a, b) {
        return b.amount - a.amount || a.createdAt - b.createdAt;
      });
    }
    function formatYuan(n) {
      const text = Number.isInteger(n)
        ? n.toLocaleString("zh-CN")
        : n.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return text + "元";
    }
    function parseAmount(raw) {
      const n = Number(String(raw).replace(/[,，元\s]/g, ""));
      if (!Number.isFinite(n) || n <= 0 || n > 999999999) return null;
      return Math.round(n * 100) / 100;
    }
    function amountFrom(raw) {
      const text = String(raw).replace(/[￥¥元\s]/g, "");
      if (/万$/.test(text)) {
        const n = Number(text.slice(0, -1).replace(/[,，]/g, ""));
        if (!Number.isFinite(n) || n <= 0) return null;
        const yuan = Math.round(n * 10000 * 100) / 100;
        return yuan > 999999999 ? null : yuan;
      }
      return parseAmount(text);
    }
    function parseImportLine(line) {
      let text = line.replace(/\u3000/g, " ").trim();
      if (!text) return null;
      text = text.replace(/[。；;]+$/g, "").replace(/^\d+\s*[.、)）]\s*/, "");
      const matched = text.match(/^(.+?)(?:\s+|[,，:：])\s*(?:礼金\s*)?([￥¥]?\s*[\d,，.]+(?:\s*万)?\s*元?)$/)
        || text.match(/^(\D+?)([￥¥]?\s*[\d,，.]+(?:\s*万)?\s*元?)$/);
      if (!matched) return { error: line.trim() };
      const name = matched[1].replace(/[：:，,\s]+$/g, "").trim();
      const amount = amountFrom(matched[2]);
      if (!name || name.length > 12 || amount == null) return { error: line.trim() };
      return { name: name, amount: amount };
    }
    function mix(color, t, toward) {
      return color.map(function (v, i) { return Math.round(v + (toward[i] - v) * t); });
    }
    function rgb(c) { return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }
    function tierColor(i, n) {
      const t = n <= 1 ? 0 : i / (n - 1);
      if (t < 0.45) return mix([150, 28, 46], t / 0.45, [168, 42, 54]);
      return mix([214, 168, 92], (t - 0.45) / 0.55, [236, 214, 158]);
    }
    function textColor(i, n) {
      const t = n <= 1 ? 0 : i / (n - 1);
      return t < 0.55 ? "#f4ddb0" : "#fff8ec";
    }
    function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
    function add(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
    function mul(a, s) { return [a[0] * s, a[1] * s]; }
    function length(v) { return Math.hypot(v[0], v[1]); }
    function norm(v) {
      const l = length(v) || 1;
      return [v[0] / l, v[1] / l];
    }
    function roundPoly(points, radii, segments) {
      const n = points.length;
      const out = [];
      for (let i = 0; i < n; i++) {
        const prev = points[(i - 1 + n) % n];
        const curr = points[i];
        const next = points[(i + 1) % n];
        const toPrev = sub(prev, curr);
        const toNext = sub(next, curr);
        const cut = Math.min(radii[i], length(toPrev) / 2.4, length(toNext) / 2.4);
        const a = add(curr, mul(norm(toPrev), cut));
        const b = add(curr, mul(norm(toNext), cut));
        out.push(a);
        for (let s = 1; s <= segments; s++) {
          const t = s / segments;
          const u = 1 - t;
          out.push(add(add(mul(a, u * u), mul(curr, 2 * u * t)), mul(b, t * t)));
        }
      }
      return out;
    }
    function pathFrom(points) {
      return "M " + points.map(function (p) {
        return p[0].toFixed(2) + " " + p[1].toFixed(2);
      }).join(" L ") + " Z";
    }
    function shape(w, h, inset, dome) {
      if (dome) {
        return pathFrom(roundPoly(
          [[w / 2, 1], [w - 1, h - 1], [1, h - 1]],
          [Math.min(w * 0.42, 48), 18, 18],
          8
        ));
      }
      const top = Math.max(8, w - inset * 2);
      const left = (w - top) / 2;
      return pathFrom(roundPoly(
        [[left, 1], [w - left, 1], [w - 1, h - 1], [1, h - 1]],
        [12, 12, 14, 14],
        4
      ));
    }
    function metrics(i, n, containerW) {
      const outer = containerW * 0.98;
      const topBase = Math.max(148, containerW * 0.36);
      if (n === 1) return { w: Math.round(Math.max(156, containerW * 0.42)), h: 118, inset: 0, dome: true };
      if (i === 0) return { w: Math.round(topBase), h: 118, inset: 0, dome: true };
      const span = n - 1;
      const top = topBase + (outer - topBase) * ((i - 1) / span);
      const bottom = topBase + (outer - topBase) * (i / span);
      return { w: Math.round(bottom), h: 76, inset: (bottom - top) / 2, dome: false };
    }
    function tierSvg(w, h, inset, dome, base, id) {
      const light = mix(base, 0.34, [255, 255, 255]);
      const dark = mix(base, 0.2, [40, 16, 16]);
      const d = shape(w, h, inset, dome);
      return '<svg viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
        '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="' + rgb(light) + '"/>' +
        '<stop offset="38%" stop-color="' + rgb(base) + '"/>' +
        '<stop offset="100%" stop-color="' + rgb(dark) + '"/>' +
        '</linearGradient></defs>' +
        '<path d="' + d + '" fill="url(#' + id + ')"/>' +
        '</svg>';
    }
    function renderCircles(list, width) {
      const maxAmt = list[0].amount || 1;
      const maxR = Math.min(width * 0.2, 78);
      const minR = 26;
      const html = list.map(function (item, i) {
        const r = Math.max(minR, maxR * Math.sqrt(item.amount / maxAmt));
        const t = list.length <= 1 ? 0 : i / (list.length - 1);
        const base = mix([168, 112, 28], t, [230, 198, 128]);
        const light = mix(base, 0.5, [255, 246, 224]);
        const dark = mix(base, 0.35, [92, 52, 16]);
        const inside = r >= 46;
        const nameSize = Math.round(Math.max(13, Math.min(18, r * 0.3)));
        const amtSize = Math.round(Math.max(12, Math.min(15, r * 0.24)));
        const face = inside
          ? '<span class="blabel" style="font-size:' + nameSize + 'px"><span class="bname">' + escapeHtml(item.name) + '</span><span class="bamt" style="font-size:' + amtSize + 'px">' + formatYuan(item.amount) + '</span></span>'
          : "";
        const caption = inside
          ? ""
          : '<span class="caption"><span class="bname">' + escapeHtml(item.name) + '</span><span class="bamt">' + formatYuan(item.amount) + '</span></span>';
        return '<button type="button" class="bubble" data-id="' + item.id + '">' +
          '<span class="disc" style="width:' + (r * 2) + 'px;height:' + (r * 2) + 'px;background:radial-gradient(circle at 35% 30%,' + rgb(light) + ',' + rgb(base) + ' 48%,' + rgb(dark) + ')">' + face + '</span>' +
          caption +
          '</button>';
      }).join("");
      return '<div class="bubbles">' + html + '</div>';
    }
    function visible(list) {
      const q = query.trim();
      if (!q) return list;
      return list.filter(function (item) { return item.name.indexOf(q) !== -1; });
    }
    function render() {
      const list = sorted();
      const shown = visible(list);
      const total = list.reduce(function (sum, item) { return sum + item.amount; }, 0);
      document.getElementById("countText").textContent = list.length + "笔";
      document.getElementById("sumText").textContent = formatYuan(total);
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (tab) {
        tab.classList.toggle("on", tab.dataset.view === view);
      });
      if (!list.length) {
        main.innerHTML = '<div class="empty"><strong>还没有记录</strong>点右上角添加第一笔礼金</div>';
        return;
      }
      if (!shown.length) {
        main.innerHTML = '<div class="empty"><strong>没有找到这个名字</strong>换个字再搜，或清空搜索</div>';
        return;
      }
      const width = main.clientWidth - 8;
      if (view === "circle") {
        main.innerHTML = renderCircles(shown, width);
        return;
      }
      const html = shown.map(function (item, i) {
        const m = metrics(i, shown.length, width);
        const base = tierColor(i, shown.length);
        return '<button type="button" class="tier' + (m.dome ? ' dome' : '') + (m.w < 190 ? ' narrow' : '') + '" data-id="' + item.id + '" style="width:' + m.w + 'px;height:' + m.h + 'px;color:' + textColor(i, shown.length) + '">' +
          tierSvg(m.w, m.h, m.inset, m.dome, base, "g" + i) +
          '<span class="label"><span class="name">' + escapeHtml(item.name) + '</span><span class="amt">' + formatYuan(item.amount) + '</span></span>' +
          '</button>';
      }).join("");
      main.innerHTML = '<div class="stack">' + html + '</div>';
    }
    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function (ch) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
      });
    }
    function openDialog(record) {
      editingId = record ? record.id : null;
      deleteArmed = false;
      dialogTitle.textContent = record ? "编辑详情" : "添加礼金";
      nameInput.value = record ? record.name : "";
      relationInput.value = record && record.relation ? record.relation : "";
      amountInput.value = record ? formatYuan(record.amount) : "";
      err.textContent = "";
      deleteBtn.textContent = "删除这笔";
      deleteBtn.classList.toggle("show", !!record);
      mask.classList.add("show");
      nameInput.focus();
    }
    function closeDialog() {
      mask.classList.remove("show");
      editingId = null;
      deleteArmed = false;
    }
    searchInput.addEventListener("input", function () {
      query = searchInput.value;
      render();
    });
    document.getElementById("tabs").addEventListener("click", function (event) {
      const tab = event.target.closest(".tab");
      if (!tab || tab.dataset.view === view) return;
      view = tab.dataset.view;
      render();
    });
    document.getElementById("addBtn").addEventListener("click", function () { openDialog(null); });
    document.getElementById("cancelBtn").addEventListener("click", closeDialog);
    mask.addEventListener("click", function (event) {
      if (event.target === mask) closeDialog();
    });
    const importMask = document.getElementById("importMask");
    const importForm = document.getElementById("importForm");
    const importText = document.getElementById("importText");
    const importErr = document.getElementById("importErr");
    function openImport() {
      importText.value = "";
      importErr.textContent = "";
      importMask.classList.add("show");
      importText.focus();
    }
    function closeImport() {
      importMask.classList.remove("show");
    }
    document.getElementById("recognizeBtn").addEventListener("click", openImport);
    document.getElementById("importCancel").addEventListener("click", closeImport);
    importMask.addEventListener("click", function (event) {
      if (event.target === importMask) closeImport();
    });
    importForm.addEventListener("submit", function (event) {
      event.preventDefault();
      const ok = [];
      const bad = [];
      importText.value.split(/\r?\n/).forEach(function (line) {
        const parsed = parseImportLine(line);
        if (!parsed) return;
        if (parsed.error) bad.push(parsed.error);
        else ok.push(parsed);
      });
      if (!ok.length) {
        importErr.textContent = bad.length ? "没有认出姓名和礼金，一行一位" : "请先粘贴文字";
        return;
      }
      const now = Date.now();
      ok.forEach(function (item, i) {
        records.push({
          id: now.toString(36) + i.toString(36) + Math.random().toString(36).slice(2, 6),
          name: item.name,
          relation: "",
          amount: item.amount,
          createdAt: now + i
        });
      });
      saveStore();
      query = "";
      searchInput.value = "";
      render();
      if (bad.length) {
        importText.value = bad.join("\n");
        importErr.textContent = "已添加 " + ok.length + " 笔，下面这几行没认出来";
        return;
      }
      closeImport();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key !== "Escape") return;
      if (importMask.classList.contains("show")) closeImport();
      else closeDialog();
    });
    amountInput.addEventListener("focus", function () {
      const n = parseAmount(amountInput.value);
      amountInput.value = n == null ? "" : String(n);
    });
    amountInput.addEventListener("blur", function () {
      const n = parseAmount(amountInput.value);
      if (n != null) amountInput.value = formatYuan(n);
    });
    main.addEventListener("click", function (event) {
      const button = event.target.closest(".tier, .bubble");
      if (!button) return;
      const record = records.find(function (item) { return item.id === button.dataset.id; });
      if (record) openDialog(record);
    });
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const name = nameInput.value.trim();
      const relation = relationInput.value.trim();
      const amount = parseAmount(amountInput.value);
      if (!name) { err.textContent = "请填写姓名"; return; }
      if (amount == null) { err.textContent = "请填写大于 0 的礼金数额"; return; }
      if (editingId) {
        const record = records.find(function (item) { return item.id === editingId; });
        if (record) {
          record.name = name;
          record.relation = relation;
          record.amount = amount;
        }
      } else {
        records.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
          name: name,
          relation: relation,
          amount: amount,
          createdAt: Date.now()
        });
      }
      saveStore();
      closeDialog();
      render();
    });
    deleteBtn.addEventListener("click", function () {
      if (!deleteArmed) {
        deleteArmed = true;
        deleteBtn.textContent = "确认删除";
        return;
      }
      records = records.filter(function (item) { return item.id !== editingId; });
      saveStore();
      closeDialog();
      render();
    });
    window.addEventListener("resize", render);
    render();
  </script>
</body>
</html>
